; First Person's options, read when the game starts.
enabled = true
; switches First Person on and off in game: F1-F12, A-Z, 0-9, or none
toggle_key = F6
; first person in: on_foot, vehicle, mech, emplacement, hellpod, ship, ragdoll (comma separated)
first_person_in = on_foot
; other mods may change the view (a vehicle mod's first person, say)
mods_may_change_view = true
; the eye, from the head node: metres along the view, and up
eye_forward = 0.12
eye_up = 0.06
; the field of view in first person: degrees top to bottom (40-110), or game for the game's own
fov = 74
; the weapon held up in the view while hip firing, as a soldier carries a rifle at the ready
ready_pose = true
